apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('keystore.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def signingValue = { name ->
    if (project.hasProperty(name)) {
        return project.property(name)
    }
    if (signingProperties.containsKey(name)) {
        return signingProperties.getProperty(name)
    }
    return System.getenv("SCENE_${name}".toString())
}

def releaseStoreFile = signingValue('RELEASE_STORE_FILE')
def releaseStorePassword = signingValue('RELEASE_STORE_PASSWORD')
def releaseKeyAlias = signingValue('RELEASE_KEY_ALIAS')
def releaseKeyPassword = signingValue('RELEASE_KEY_PASSWORD')
def releaseSigningValues = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
def releaseSigningConfigured = releaseSigningValues.every { it }
if (!releaseSigningConfigured && releaseSigningValues.any { it }) {
    throw new GradleException('Incomplete release signing config. Required: RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD.')
}

android {
    applicationVariants.all { variant ->
        variant.outputs.all {
            def signingSuffix = (!releaseSigningConfigured && variant.buildType.name.startsWith('release')) ? '_unsigned' : ''
            def fileName = "Scene" + "_${defaultConfig.versionName}_${defaultConfig.versionCode}_" + variant.name + signingSuffix + ".apk"
            outputFileName = fileName
        }
    }
    dataBinding {
        enabled =true
    }
    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
            }
        }
    }
    compileSdkVersion 30
    buildToolsVersion '29.0.2'
    defaultConfig {
        resConfigs "zh"
        applicationId "org.eu.texsd.vtools"
        minSdkVersion 21
        targetSdkVersion 29
		//github version is a bit newer (december), so add it and bypass
        versionCode 202503201
        versionName "5.0.0 Alpha"
        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
        ndk {
            // abiFilters "armeabi", "armeabi-v7a", "arm64-v8a", "x86", "x86_64", "mips", "mips64"
            abiFilters "arm64-v8a", "armeabi-v7a", "x86", "x86_64"
        }
    }
    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            zipAlignEnabled true
            debuggable false
            jniDebuggable = false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
        release_mini {
            shrinkResources true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            minifyEnabled true
            debuggable false
            jniDebuggable = false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            debuggable true
            jniDebuggable = false
        }
    }
    productFlavors {
    }
    /*
    android.applicationVariants.all { variant ->
        variant.outputs.all {
            variant.getPackageApplication().outputDirectory = new File(project.rootDir.absolutePath + "/build/outputs/apk/release")
            outputFileName = "${project.name}_${defaultConfig.versionName}_${variant.buildType.name}.apk"
        }
    }
    */
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.10.2"
        }
    }
    ndkVersion '23.1.7779620'

    // tests rely on JUnit-based classes
    useLibrary 'android.test.runner'
    useLibrary 'android.test.base'
}

